name: Browser WebAssembly

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - bindings/wasm/**
      - examples/static-viewer/**
      - .github/workflows/browser-wasm.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - bindings/wasm/**
      - examples/static-viewer/**
      - .github/workflows/browser-wasm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the Rust toolchain and WebAssembly target
        run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build browser package
        run: npm run build:wasm --prefix bindings/wasm
      - name: Test memory-based document conversion
        run: cargo test --test in_memory_conversion
