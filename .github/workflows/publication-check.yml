name: Publication check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  publication-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 scripts/check-publication.py
        env:
          PUBLICATION_DENY_TERMS: ${{ vars.PUBLICATION_DENY_TERMS }}
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.0 fmt --all -- --check
      - run: cargo +1.93.0 test --workspace --locked
      - run: cargo +1.93.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Node native build and tests
        working-directory: bindings/node
        run: |
          npm ci
          npm run build
          npm test
        env:
          RUSTUP_TOOLCHAIN: '1.93.0'
      - name: Python wheel and tests
        run: |
          python3 -m venv .tmp/ci-python
          .tmp/ci-python/bin/pip install 'pytest>=8,<10' ./bindings/python
          .tmp/ci-python/bin/python -m pytest -q tests bindings/python/tests
        env:
          RUSTUP_TOOLCHAIN: '1.93.0'
      - name: Check dependency licenses and bundled notices
        run: |
          cargo +1.93.0 install cargo-deny --version 0.20.2 --locked
          .tmp/ci-python/bin/python scripts/audit-licenses.py --check
