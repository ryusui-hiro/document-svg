name: Publish crates.io
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Verified GitHub release tag'
        required: true
        default: 'v2.0.1'
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      # Release tooling comes from main; the published source comes from the tag,
      # which may predate the current scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Check that the manifest matches the release tag
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          manifest=$(cargo +1.93.0 metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "document-svg"))')
          if [ "v$manifest" != "$RELEASE_TAG" ]; then
            echo "Cargo.toml version v$manifest does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Package and verify
        working-directory: release-source
        # publish --dry-run only leaves the crate under target/package/tmp-*,
        # so package it again (same bytes) where the release check looks.
        run: |
          cargo +1.93.0 publish -p document-svg --locked --dry-run
          cargo +1.93.0 package -p document-svg --locked --no-verify
      - name: Verify release crate and registry state
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          crate="document-svg-$version.crate"
          mkdir -p dist/crates-release
          gh release download "$RELEASE_TAG" --pattern "$crate" --dir dist/crates-release
          python3 scripts/check-crates-release.py \
            --tag "$RELEASE_TAG" \
            --local-crate "release-source/target/package/$crate" \
            --release-crate "dist/crates-release/$crate"
      - name: Authenticate with the configured trusted publisher
        if: steps.verify.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish
        if: steps.verify.outputs.publish == 'true'
        working-directory: release-source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.93.0 publish -p document-svg --locked
