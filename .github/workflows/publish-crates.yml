name: Publish crates.io
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Verified GitHub release tag'
        required: true
        default: 'v0.1.1'
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Check that the manifest matches the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          manifest=$(cargo +1.93.0 metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "document-svg"))')
          if [ "v$manifest" != "$RELEASE_TAG" ]; then
            echo "Cargo.toml version v$manifest does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Package and verify
        run: cargo +1.93.0 publish -p document-svg --locked --dry-run
      - name: Authenticate with the configured trusted publisher
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.93.0 publish -p document-svg --locked
