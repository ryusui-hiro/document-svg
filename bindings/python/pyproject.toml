[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "document-svg"
version = "0.1.0"
description = "Fast PDF/OOXML to SVG conversion and SVG to OOXML packaging powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md"]
authors = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
module-name = "document_svg._native"
python-source = "python"
strip = true
