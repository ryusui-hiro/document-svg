[package]
name = "document-svg-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for document-svg"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "document_svg_python"
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
document-svg = { path = "../.." }
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
