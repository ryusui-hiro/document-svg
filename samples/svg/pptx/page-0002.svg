    <tspan xml:space="preserve" font-family="Calibri" font-size="16" font-weight="400" font-style="normal" baseline-shift="0" fill="#263238" fill-opacity="1">•  Every page becomes page-NNNN.svg</tspan>
  </text>
  <text id="pptx-slide-2-3-text-2-2" x="46.57008" y="243.87244" text-anchor="start" transform="matrix(1 0 0 1 0 0)" opacity="1" stroke="none" data-content-kind="text" data-source-id="Body">
    <tspan xml:space="preserve" font-family="Calibri" font-size="16" font-weight="400" font-style="normal" baseline-shift="0" fill="#263238" fill-opacity="1">•  Fonts, shapes and images stay in the file</tspan>
  </text>
  <text id="pptx-slide-2-3-text-3-3" x="46.57008" y="259.87244" text-anchor="start" transform="matrix(1 0 0 1 0 0)" opacity="1" stroke="none" data-content-kind="text" data-source-id="Body">
    <tspan xml:space="preserve" font-family="Calibri" font-size="16" font-weight="400" font-style="normal" baseline-shift="0" fill="#263238" fill-opacity="1">•  A conversion.json records warnings and timing</tspan>
  </text>
  <text id="pptx-slide-2-3-text-4-4" x="46.57008" y="275.87244" text-anchor="start" transform="matrix(1 0 0 1 0 0)" opacity="1" stroke="none" data-content-kind="text" data-source-id="Body">
