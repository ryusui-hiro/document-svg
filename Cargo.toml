[package]
name = "document-svg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded PDF/OOXML to SVG conversion and SVG to OOXML packaging in Rust"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/ryusui-hiro/document-svg"
include = ["/src/**", "/tests/*.rs", "/examples/custom_ir.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/LICENSE-MIT", "/LICENSE-APACHE", "/README.md", "/THIRD_PARTY_NOTICES.md", "/docs/SUPPORT.md", "/docs/ARCHITECTURE.md", "/docs/AI_USAGE_GUIDE.md"]

[workspace]
members = ["bindings/node", "bindings/python"]
resolver = "3"

[lib]
name = "document_svg"
path = "src/lib.rs"

[[bin]]
name = "docsvg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
emf-core = { version = "0.1.0", default-features = false, features = ["svg"] }
hayro-ccitt = "0.3.0"
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.6.1"
lopdf = { version = "0.44.0", default-features = false }
png = "0.18.1"
quick-xml = "0.41.0"
rayon = "1.12.0"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stet-fonts = "0.4.1"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
